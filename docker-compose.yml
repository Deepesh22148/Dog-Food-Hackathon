services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: hackathons

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hackathons"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 5s

  migrate:
    build:
      context: ./src
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - ./src/.env.production
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ./src
      dockerfile: Dockerfile
      target: seed
    env_file:
      - ./src/.env.production
    command: sh -c "npx prisma generate && npm run seed"
    depends_on:
      migrate:
        condition: service_completed_successfully

  nextjs:
    build:
      context: ./src
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    env_file:
      - ./src/.env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
